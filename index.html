<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Quik-do</title>
    <meta name="description" content="A modern, feature-rich todo list app with priority management, tagging, due dates, and progress tracking. Built with React and ready for AWS deployment." />
    <meta name="author" content="Ghassan Elgendy" />

    <meta property="og:title" content="Quik-do - Let it happen." />
    <meta property="og:description" content="A modern, feature-rich todo list app with priority management, tagging, due dates, and progress tracking. Built with React and ready for AWS deployment." />
    <meta property="og:type" content="website" />

    <script>
      // Prevent flash of unstyled content by setting theme immediately
      (function() {
        const stored = localStorage.getItem('theme-config');
        if (stored) {
          try {
            const theme = JSON.parse(stored);
            document.documentElement.classList.add(theme.mode);
            if (theme.accent !== 'default') {
              document.documentElement.classList.add(`theme-${theme.accent}`);
            }
          } catch (e) {
            // Fallback to system preference
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.classList.add(isDark ? 'dark' : 'light');
          }
        } else {
          // No stored theme, use system preference
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(isDark ? 'dark' : 'light');
        }
      })();
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
